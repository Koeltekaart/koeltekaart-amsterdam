<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Koeltekaart — Data Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
  <link rel="stylesheet" href="libs/leaflet/leaflet.css" />
  <style>
    @font-face {
      font-family: 'AmsterdamSans';
      src: url('fonts/AmsterdamSans-Regular.woff2') format('woff2');
      font-weight: 400; font-display: swap;
    }
    @font-face {
      font-family: 'AmsterdamSans';
      src: url('fonts/AmsterdamSans-Bold.woff2') format('woff2');
      font-weight: 700; font-display: swap;
    }
    @font-face {
      font-family: 'AmsterdamSans';
      src: url('fonts/AmsterdamSans-ExtraBold.woff2') format('woff2');
      font-weight: 800; font-display: swap;
    }

    :root {
      color-scheme: light;
      --bg:        #f4f3f1;
      --surface:   #ffffff;
      --surface-2: #faf9f7;
      --border:    #e0ded9;
      --ink:       #131313;
      --ink-2:     #565651;
      --ink-3:     #8a8a84;
      --blue:      #004699;
      --blue-soft: #cfe0f4;
      --good:      #00893c;
      --warn:      #d97e00;
      --bad:       #ec0000;
      --track:     #ecebe7;
      --shadow:    0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg:        #131313;
      --surface:   #1c1c1b;
      --surface-2: #232322;
      --border:    #33322f;
      --ink:       #f5f4f0;
      --ink-2:     #b6b5ad;
      --ink-3:     #83827b;
      --blue:      #6ba4e8;
      --blue-soft: #274a72;
      --good:      #3fbf74;
      --warn:      #e5a13a;
      --bad:       #f06a6a;
      --track:     #2b2b29;
      --shadow:    0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg:#131313; --surface:#1c1c1b; --surface-2:#232322; --border:#33322f;
        --ink:#f5f4f0; --ink-2:#b6b5ad; --ink-3:#83827b;
        --blue:#6ba4e8; --blue-soft:#274a72; --good:#3fbf74; --warn:#e5a13a; --bad:#f06a6a;
        --track:#2b2b29; --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
      }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'AmsterdamSans', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.45;
    }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 24px 20px 72px; }

    header.top { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
    header.top .titles { flex: 1 1 320px; }
    h1 { font-size: 1.55rem; font-weight: 800; margin: 0 0 2px; letter-spacing: -.01em; }
    .sub { color: var(--ink-2); font-size: .92rem; margin: 0; }
    .meta { color: var(--ink-3); font-size: .82rem; margin-top: 6px; }
    .meta b { color: var(--ink-2); font-weight: 700; }

    .controls { display: flex; gap: 8px; align-items: center; }
    button.btn {
      font-family: inherit; font-size: .82rem; font-weight: 700;
      color: var(--ink-2); background: var(--surface); border: 1px solid var(--border);
      border-radius: 999px; padding: 7px 14px; cursor: pointer; transition: .15s;
    }
    button.btn:hover { border-color: var(--ink-3); color: var(--ink); }

    section.block { margin-top: 32px; }
    .sec-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 4px; }
    .sec-head h2 { font-size: 1.02rem; font-weight: 800; margin: 0; letter-spacing: -.005em; }
    .sec-head .why { color: var(--ink-3); font-size: .82rem; }
    .sec-rule { height: 1px; background: var(--border); margin: 8px 0 18px; }

    /* KPI tiles */
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 18px; }
    @media (max-width: 760px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
    .kpi {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 16px 16px 14px; box-shadow: var(--shadow);
    }
    .kpi .k-label { font-size: .78rem; color: var(--ink-2); font-weight: 700; }
    .kpi .k-val { font-size: 2.1rem; font-weight: 800; line-height: 1.05; margin: 6px 0 2px; letter-spacing: -.02em; }
    .kpi .k-val small { font-size: .95rem; color: var(--ink-3); font-weight: 700; }
    .kpi .k-note { font-size: .78rem; color: var(--ink-3); }
    .kpi .k-note.good { color: var(--good); }
    .kpi .k-note.warn { color: var(--warn); }
    .kpi .k-note.bad  { color: var(--bad); }

    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    @media (max-width: 820px) { .cards { grid-template-columns: 1fr; } }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 18px 18px 16px; box-shadow: var(--shadow);
    }
    .card h3 { font-size: .92rem; font-weight: 800; margin: 0 0 2px; }
    .card .card-why { font-size: .8rem; color: var(--ink-3); margin: 0 0 14px; }

    /* Bar rows */
    .bars { display: flex; flex-direction: column; gap: 9px; }
    .bar-row { display: grid; grid-template-columns: 128px 1fr auto; align-items: center; gap: 10px; }
    .bar-row .b-label { font-size: .82rem; color: var(--ink-2); font-weight: 700; text-align: right;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-track { position: relative; height: 20px; background: var(--track); border-radius: 5px; overflow: hidden; }
    .bar-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; min-width: 3px;
      transition: width .5s cubic-bezier(.2,.7,.2,1); }
    .bar-row .b-val { font-size: .82rem; font-weight: 800; color: var(--ink); min-width: 44px; text-align: right;
      font-variant-numeric: tabular-nums; }
    .bar-row .b-val .b-sub { color: var(--ink-3); font-weight: 700; font-size: .74rem; }
    .bar-row.hot .b-label { color: var(--bad); }

    /* to-do lists */
    .todo { border-top: 1px solid var(--border); margin-top: 14px; padding-top: 12px; }
    .todo details { margin-bottom: 6px; }
    .todo summary { cursor: pointer; font-size: .82rem; font-weight: 700; color: var(--ink-2); list-style: none;
      display: flex; align-items: center; gap: 8px; }
    .todo summary::-webkit-details-marker { display: none; }
    .todo summary .pill { font-size: .72rem; font-weight: 800; border-radius: 999px; padding: 1px 8px; }
    .pill.bad  { background: color-mix(in srgb, var(--bad) 15%, transparent);  color: var(--bad); }
    .pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
    .pill.good { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
    .todo summary .chev { color: var(--ink-3); transition: transform .15s; margin-left: auto; }
    .todo details[open] summary .chev { transform: rotate(90deg); }
    .todo .names { margin: 8px 0 4px; padding-left: 2px; display: flex; flex-wrap: wrap; gap: 6px; }
    .todo .names span { font-size: .76rem; color: var(--ink-2); background: var(--surface-2);
      border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; }
    .todo .allgood { font-size: .8rem; color: var(--good); font-weight: 700; }

    .legend { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-top: 14px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--ink-2); }
    .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

    /* tooltip */
    #tip { position: fixed; z-index: 50; pointer-events: none; opacity: 0; transition: opacity .1s;
      background: var(--ink); color: var(--bg); font-size: .76rem; font-weight: 600;
      padding: 6px 9px; border-radius: 7px; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: 240px; }
    #tip b { font-weight: 800; }

    /* access map */
    .access { display: flex; gap: 18px; flex-wrap: wrap; align-items: stretch; }
    .access .map-card { flex: 3 1 460px; }
    .access .list-card { flex: 1 1 260px; }
    .access-cov { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 16px; }
    @media (max-width: 560px) { .access-cov { grid-template-columns: 1fr; } }
    #accessMap { height: 520px; border-radius: 10px; overflow: hidden; background: var(--surface-2); }
    @media (max-width: 640px) { #accessMap { height: 380px; } }
    .leaflet-container { font: inherit; background: var(--surface-2); }
    .leaflet-tooltip.wtip { font: inherit; font-size: .78rem; }
    .leaflet-tooltip.wtip b { font-weight: 800; }
    .access .heat-scale { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: .74rem; color: var(--ink-3); }
    .access .heat-scale .ramp { flex: 1; height: 8px; border-radius: 4px;
      background: linear-gradient(90deg, rgba(226,74,42,.12), rgba(226,74,42,.85)); }
    .rank { display: flex; flex-direction: column; gap: 9px; }
    .rank .r-row { display: grid; grid-template-columns: 20px 1fr auto; align-items: center; gap: 9px; }
    .rank .r-n { font-size: .8rem; font-weight: 800; color: var(--ink-3); text-align: right; }
    .rank .r-name { font-size: .84rem; font-weight: 700; color: var(--ink); overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; }
    .rank .r-name small { color: var(--ink-3); font-weight: 600; }
    .rank .r-dist { font-size: .82rem; font-weight: 800; color: var(--bad); font-variant-numeric: tabular-nums; }

    .loading, .err { padding: 40px; text-align: center; color: var(--ink-3); font-size: .9rem; }
    .err { color: var(--bad); }
    footer { margin-top: 40px; color: var(--ink-3); font-size: .78rem; text-align: center; }
    footer a { color: var(--ink-2); }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="titles">
        <h1>Koeltekaart&nbsp;·&nbsp;Data</h1>
        <p class="meta" id="freshness">Loading…</p>
      </div>
      <div class="controls">
        <button class="btn" id="themeBtn" type="button">◐ Theme</button>
        <button class="btn" id="reloadBtn" type="button">↻ Refresh</button>
      </div>
    </header>
    <div id="app"><div class="loading">Fetching data/locations.csv …</div></div>
    <footer>
      Reads the live CSVs on each load. Serve with <code>python3 serve.py</code>, open <code>/dashboard.html</code>.
    </footer>
  </div>
  <div id="tip"></div>
  <script src="libs/leaflet/leaflet.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
