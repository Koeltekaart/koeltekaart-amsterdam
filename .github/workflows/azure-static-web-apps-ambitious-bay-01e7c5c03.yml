name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  # Redeploy main on demand ("Run workflow"), without inventing a dummy commit.
  # Needed when a deploy was cancelled and no further push follows to supersede
  # it — otherwise the only recovery is re-running a run from the API.
  workflow_dispatch: {}

# Rapid sheet edits push several "data: refresh" commits in a row, each
# triggering a deploy. Without this, an older deploy is still running when the
# next starts, and Azure cancels it server-side — reporting a *failure* to
# GitHub (= a failure email) even though the newest deploy succeeds. Grouping
# by ref with cancel-in-progress makes GitHub supersede the stale run itself,
# which shows as "cancelled" (no failure notification) and lets only the latest
# commit deploy. PR previews (different refs) are unaffected.
#
# The group is scoped by EVENT as well as ref. Without that, the
# "pull_request: closed" run fired when a PR is merged lands in the same group
# as the push run publishing that very merge, and cancels it — observed twice,
# each time leaving main's HEAD undeployed with no newer run to supersede it, so
# merged code silently never reached production while main looked healthy.
# Only pushes to the same branch may collapse into one another.
concurrency:
  group: azure-swa-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      # Debounce bursts. Rapid sheet edits push several "data: refresh" commits
      # within a minute or two; each would otherwise fire its own Azure deploy,
      # and enough in a short window makes Azure reject with "Too many
      # deployments have been requested" (a real failure + failure email).
      # This deliberate wait lets the concurrency group above do the work: if a
      # newer commit arrives while we sit here, cancel-in-progress cancels this
      # (still-waiting) run, so a burst collapses into a single deploy of the
      # latest commit instead of many throttled ones.
      # Skipped for workflow_dispatch: a manual run is a deliberate "publish now"
      # (typically recovering a missed deploy), not part of an edit burst.
      - name: Debounce burst deploys
        if: github.event_name != 'workflow_dispatch'
        run: sleep 60

      - uses: actions/checkout@v6
        with:
          submodules: true
          lfs: false
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v9
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string
      - name: Build And Deploy
        id: builddeploy
        # Don't fail the job yet: Azure may transiently reject with "Too many
        # deployments have been requested" during an editing burst. We retry
        # once below after a wait before giving up (and emailing a failure).
        continue-on-error: true
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_BAY_01E7C5C03 }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "" # No build step — serve repo root as-is
          skip_app_build: true # Static site: skip Oryx build (no package.json)
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######

      - name: Wait out Azure deploy throttle
        if: steps.builddeploy.outcome == 'failure'
        run: sleep 120

      # Retry once. This step is NOT continue-on-error, so if Azure is still
      # throttling after the wait the job fails (and you get one email) — by
      # then a genuine, persistent problem is worth surfacing.
      - name: Build And Deploy (retry)
        if: steps.builddeploy.outcome == 'failure'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_BAY_01E7C5C03 }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: ""
          skip_app_build: true
          github_id_token: ${{ steps.idtoken.outputs.result }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          # Without this the action exits with "deployment_token was not
          # provided" — so EVERY merged PR produced a failed run and a failure
          # email, and the PR's preview environment was never torn down.
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_BAY_01E7C5C03 }}
          action: "close"
