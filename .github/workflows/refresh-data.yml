name: Refresh data from Google Sheet

# Keeps data/locations.csv and data/settings.csv in sync with the published
# Google Sheet so the public site loads from same-origin static files (fast,
# reliable) instead of a live third-party request. Editors keep using the sheet;
# changes go live within the schedule interval below.

on:
  schedule:
    - cron: "*/15 * * * *"   # fallback poll every 15 minutes
  workflow_dispatch: {}       # allow manual "Run workflow"
  repository_dispatch:
    types: [sheet-updated]    # triggered by Google Apps Script on sheet edit

permissions:
  contents: write
  id-token: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install --quiet google-api-python-client google-auth Pillow

      - name: Fetch CSVs from the private sheet (service account, live read)
        env:
          # The spreadsheet is shared ONLY to the service account — never to the
          # public — and we read it through the official Sheets API (not the
          # cached /pub snapshot that lagged edits by minutes). The sheet id and
          # the service-account key are both secrets, so nothing about the source
          # is exposed; the public site only ever serves the static files below.
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          LOCATIONS_GID: "0"
          SETTINGS_GID: "971775516"
        run: |
          set -euo pipefail
          if [ -z "${SHEET_ID:-}" ] || [ -z "${GOOGLE_SERVICE_ACCOUNT_KEY:-}" ]; then
            echo "::error::Secrets SHEET_ID and GOOGLE_SERVICE_ACCOUNT_KEY must be set (Settings → Secrets and variables → Actions → Secrets)."
            exit 1
          fi
          python3 scripts/fetch_sheet.py "$LOCATIONS_GID" /tmp/locations.csv
          python3 scripts/fetch_sheet.py "$SETTINGS_GID"  /tmp/settings.csv

          # Cheap guardrails: never overwrite good data with an empty/error body.
          # (Deeper per-cell validation runs in the next step.)
          test "$(wc -c < /tmp/locations.csv)" -gt 200
          head -1 /tmp/locations.csv | grep -q "name"
          test "$(wc -c < /tmp/settings.csv)" -gt 10
          head -1 /tmp/settings.csv | grep -qi "key"

          mv /tmp/locations.csv data/locations.csv
          mv /tmp/settings.csv  data/settings.csv

      - name: Validate data (block bad opening hours from deploying)
        run: python3 scripts/validate_data.py data/locations.csv

      # Mirror Drive photos into the repo (same-origin → instant loads) and
      # rewrite photo_url to the local path. Unchanged photos are reused.
      - name: Sync location photos
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: python3 scripts/fetch_photos.py

      - name: Detect changes
        id: diff
        run: |
          git add -A -- data images/locations
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Data/photos changed."
            git --no-pager diff --cached --stat >> "$GITHUB_STEP_SUMMARY"
          fi

      # On any branch other than main (i.e. a test run), STOP here: upload what
      # the service account fetched as an artifact for inspection, and never
      # commit or deploy. This makes "run it on a branch to verify the sheet
      # read works" completely safe for the live site.
      - name: Upload fetched data for inspection (non-main test runs)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: fetched-data
          path: |
            data/locations.csv
            data/settings.csv
            images/locations/

      - name: Commit refreshed data
        if: steps.diff.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name  "koeltekaart-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Race-proof push: rapid edit-triggered runs can collide on main
          # ("! [rejected] (fetch first)"). Rebase our freshly-generated files
          # onto the latest main and retry. Because we regenerate the whole file
          # from the sheet (the source of truth), the newest fetch always wins.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --soft origin/main        # keep our fetched files, re-base on latest
            git add -A -- data images/locations
            if git diff --cached --quiet; then
              echo "Already up to date after rebase — nothing to push."; exit 0
            fi
            git commit -q -m "data: refresh from Google Sheet [skip ci]"
            if git push -q origin HEAD:main; then
              echo "Pushed on attempt $attempt."; exit 0
            fi
            echo "Push rejected (attempt $attempt), retrying…"; sleep $((RANDOM % 5 + 2))
          done
          echo "::error::Could not push refreshed data after 5 attempts."; exit 1

      # Azure SWA requires an OIDC id-token in addition to the deploy token
      # (token-only uploads are rejected with "api key was invalid"). Mirror the
      # main CI workflow's auth so direct data deploys actually publish.
      - name: Install OIDC client (for SWA deploy auth)
        if: steps.diff.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get OIDC id token
        id: idtoken
        if: steps.diff.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v9
        with:
          script: |
            // NB: `core` is already a provided global here — requiring it into a
            // `const core` throws "Identifier 'core' has already been declared".
            const coredemo = require('@actions/core')
            return await coredemo.getIDToken()
          result-encoding: string

      - name: Deploy refreshed data to Azure
        if: steps.diff.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_BAY_01E7C5C03 }}
          github_id_token: ${{ steps.idtoken.outputs.result }}
          action: "upload"
          app_location: "/"
          output_location: ""
          skip_app_build: true
